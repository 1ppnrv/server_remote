<!DOCTYPE html>
<html lang="fr">

<head>
    <title>Console - MrBap's Server</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles/remote.css">
</head>

<body>
    <div id="menu">
        <button class="menubtn" id="consoleBtn">Console</button>
        <button class="menubtn" id="filesBtn">Files</button>
    </div>
    <div id="consolecontainer">
        <div id="btnsdiv">
            <div id="terminalselector">
            </div>
            <button id="launchkill">New</button>
        </div>
        <p id="output"></p>
        <div id="command-field">
            <input type="text" id="cmdtextfield">
            <button id="send"><img id="sendimg" alt="send" src="send.png"></button>
        </div>
    </div>
    <script src="scripts/remote.js"></script>
</body>

</html>
