[package]
name = "remote"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = {version = "0.8.9", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
portable-pty = "0.9.0"
ansi-to-html = "0.2.2"
futures-util = "0.3.32"
queue = "0.3.2-final"
async-std = "1.13.2"
tower-http = { version = "0.6", features = ["trace"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower = "0.5.3"
